# Production stack: the website and its Cloudflare Tunnel connector.
#
# No port is published on the host; the tunnel is the only way in and reaches the app as
# http://web:8000 on the internal network. The connector runs only with `--profile tunnel`.
#
#   docker compose up --build --wait web      the app alone (e.g. to try the image locally)
#   deploy/status-effects-deploy              how production runs it, see AGENTS.md
name: status-effects

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "3"
  networks: [app]

services:
  web:
    <<: *hardening
    build: .
    image: status-effects:${RELEASE:-local}
    init: true
    environment:
      SITE_URL: ${SITE_URL:-https://effects.matejkadlec.cz}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: 512m
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  cloudflared:
    <<: *hardening
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    # Root only inside the deployment account's rootless user namespace (no authority on the
    # host); needed to read the mode-0600 token file.
    user: "0:0"
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run", "--token-file", "/run/secrets/cloudflared-token"]
    secrets:
      - source: cloudflared_token
        target: cloudflared-token
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    stop_grace_period: 30s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    depends_on:
      web:
        condition: service_healthy

secrets:
  cloudflared_token:
    file: ${CLOUDFLARED_TOKEN_FILE:-/etc/status-effects/cloudflared-token}

networks:
  app:
    name: status-effects-app
