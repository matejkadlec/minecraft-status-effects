<meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2366b8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1d1f" media="(prefers-color-scheme: dark)" />
    <meta name="author" content="{{ config.AUTHOR }}" />
    <link rel="author" href="{{ config.AUTHOR_URL }}" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="{{ asset('img/apple-touch-icon.png') }}" />
    <link rel="preload" href="/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>(function(){var d=document.documentElement;d.classList.add("js","preload");try{var s=localStorage,t=s.getItem("se-theme")||s.getItem("mcse-theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";if(t==="dark")d.classList.add("dark");if(s.getItem("se-sidebar")==="collapsed")d.classList.add("sidebar-collapsed")}catch(e){}addEventListener("load",function(){requestAnimationFrame(function(){d.classList.remove("preload")})})})();</script>
