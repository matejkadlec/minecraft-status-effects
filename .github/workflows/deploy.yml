name: Deploy

# Deploys master to https://effects.matejkadlec.cz once the Tests workflow has passed for the
# pushed commit. The SSH key in the `production` environment can only run the forced command
# deploy/status-effects-deploy on the server, which takes nothing but a commit of master and
# fetches the source itself. "Run workflow" redeploys the current master.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://effects.matejkadlec.cz
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      SITE_URL: https://effects.matejkadlec.cz
    steps:
      - name: Deploy the commit over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          SSH_HOST_KEY: ${{ vars.DEPLOY_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_HOST" && -n "$SSH_USER" && "$SSH_HOST_KEY" == ssh-ed25519\ * ]]
          port="${SSH_PORT:-22}"

          install -d -m 0700 "$RUNNER_TEMP/ssh"
          (umask 077 && printf '%s\n' "$SSH_PRIVATE_KEY" >"$RUNNER_TEMP/ssh/key")
          if [[ "$port" == "22" ]]; then
            printf '%s %s\n' "$SSH_HOST" "$SSH_HOST_KEY" >"$RUNNER_TEMP/ssh/known_hosts"
          else
            printf '[%s]:%s %s\n' "$SSH_HOST" "$port" "$SSH_HOST_KEY" >"$RUNNER_TEMP/ssh/known_hosts"
          fi

          ssh -T -F /dev/null \
            -i "$RUNNER_TEMP/ssh/key" -p "$port" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$SSH_USER@$SSH_HOST" "deploy $COMMIT"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"

      - name: Check the public site
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 "$SITE_URL/health" | grep -q '"status":"ok"'; then
              echo "The site is healthy."
              exit 0
            fi
            echo "Attempt $attempt failed, retrying ..."
            sleep 5
          done
          exit 1
