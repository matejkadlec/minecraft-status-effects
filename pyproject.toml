[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "status-effects"
version = "2.0.0"
description = "Interactive database of vanilla and modded Minecraft status effects."
readme = "README.md"
license = "LicenseRef-PolyForm-Shield-1.0.0"
license-files = ["LICENSE.md"]
authors = [{ name = "Matěj Kadlec" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.urls]
Homepage = "https://minecraftstatuseffects.com"
Repository = "https://github.com/matejkadlec/status-effects"

[project.scripts]
status-effects = "status_effects.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
status_effects = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
